name: banned-words

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test matcher
        run: python3 scripts/lint-banned-words.py --self-test
      - name: Scan copy and CMS-ish files
        run: python3 scripts/lint-banned-words.py
